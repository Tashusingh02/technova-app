version: '3.8'

services:
  app:
    build: .
    image: technova-app:latest
    container_name: technova-container
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=development
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

